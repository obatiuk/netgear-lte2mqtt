name: CI & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  NODE_OPTIONS: "--no-deprecation"
  PIP_CACHE_DIR: "/tmp/pip-cache"
  PIPENV_CACHE_DIR: "/tmp/pip-cache"
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: "advice.defaultBranchName"
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: "advice.detachedHead"
  GIT_CONFIG_VALUE_1: "false"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Fetch full Git history and tags so BUILD_VERSION resolves accurately
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "Pipfile"

      # Run verification suite on pull requests without publishing images
      - name: Run format, lint, audit, and unit tests
        if: github.event_name == 'pull_request'
        run: make build

      # Authenticate with GHCR for branch and release tag pushes
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish :dev image on master/main branch pushes
      - name: Build and publish dev container image
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish REGISTRY="ghcr.io/${OWNER_LOWER}" BUILD_VERSION=dev PUBLISH_TAG=dev

      # Publish versioned and :latest container images on v* release tags
      - name: Build and publish release container image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish REGISTRY="ghcr.io/${OWNER_LOWER}"
