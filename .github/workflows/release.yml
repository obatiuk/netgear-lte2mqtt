name: CI & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  NODE_OPTIONS: "--no-deprecation"
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: "advice.defaultBranchName"
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: "advice.detachedHead"
  GIT_CONFIG_VALUE_1: "false"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Fetch full Git history and tags so BUILD_VERSION resolves accurately
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "Pipfile"

      # Run verification suite on branch pushes and pull requests
      - name: Run format, lint, audit, and unit tests
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: make build

      # Authenticate and publish versioned + latest container images on version tags
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish REGISTRY="ghcr.io/${OWNER_LOWER}"
